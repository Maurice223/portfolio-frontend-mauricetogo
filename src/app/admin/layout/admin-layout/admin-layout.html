
<div class="admin-container">
  <aside class="sidebar">
    <a routerLink="/admin/dashboard" class="brand">
      <span class="brand-mark">M.</span>
      <span class="brand-copy">
        <strong>Maurice<span class="brand-dot">.</span>Dev</strong>
        <small>ADMINISTRATION</small>
      </span>
    </a>

    <div class="sidebar-divider"></div>

    <p class="nav-label">ESPACE DE TRAVAIL</p>

    <nav class="navigation" aria-label="Navigation administrateur">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="2"/>
            <rect x="14" y="3" width="7" height="7" rx="2"/>
            <rect x="14" y="14" width="7" height="7" rx="2"/>
            <rect x="3" y="14" width="7" height="7" rx="2"/>
          </svg>
        </span>
        <span class="nav-text">Tableau de bord</span>
        <span class="active-indicator"></span>
      </a>

      <a routerLink="/admin/projects" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3"/>
            <path d="M8 4V2.5M16 4V2.5M3 9h18M8 13h3M8 16h7"/>
          </svg>
        </span>
        <span class="nav-text">Projets</span>
        <span class="active-indicator"></span>
      </a>

      <a routerLink="/admin/skills" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>
          </svg>
        </span>
        <span class="nav-text">Compétences</span>
        <span class="active-indicator"></span>
      </a>

      <a routerLink="/admin/experiences" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="7" width="18" height="14" rx="3"/>
            <path d="M8 7V4h8v3M3 12h18M10 12v2h4v-2"/>
          </svg>
        </span>
        <span class="nav-text">Expériences</span>
        <span class="active-indicator"></span>
      </a>

      <a routerLink="/admin/educations" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m2 9 10-5 10 5-10 5L2 9Z"/>
            <path d="M6 11v5c3.5 3 8.5 3 12 0v-5M22 9v6"/>
          </svg>
        </span>
        <span class="nav-text">Formations</span>
        <span class="active-indicator"></span>
      </a>

      <a routerLink="/admin/messages" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="3"/>
            <path d="m4 7 8 6 8-6"/>
          </svg>
        </span>
        <span class="nav-text">Messages</span>
        <span class="active-indicator"></span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <p class="nav-label">RACCOURCIS</p>

      <a routerLink="/" class="nav-link secondary-link">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14 4h6v6M20 4l-9 9"/>
            <path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/>
          </svg>
        </span>
        <span class="nav-text">Voir le portfolio</span>
      </a>

      <button type="button" class="logout-button" (click)="deconnexion()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M10 17l5-5-5-5M15 12H3"/>
            <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
          </svg>
        </span>
        <span class="nav-text">Déconnexion</span>
      </button>

      <div class="admin-profile">
        <div class="avatar">MT</div>
        <div class="profile-copy">
          <strong>Maurice Togo</strong>
          <small>Administrateur</small>
        </div>
        <span class="profile-status" title="Session active"></span>
      </div>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <div class="topbar-heading">
        <span class="topbar-label">MAURICE.DEV <span>/</span> ADMIN</span>
        <p>Gestion du portfolio</p>
      </div>

      <div class="topbar-right">
        <div class="status">
          <span class="status-dot"></span>
          <span>Espace administrateur</span>
        </div>
        <div class="topbar-avatar" title="Maurice Togo">MT</div>
      </div>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
